        status: available
        summary: 运算符可作为成员或自由函数重载，支持成员与非成员混合重载集。
        difference: 重载空间远大于 C#（含 ()、->、逗号），须保持语义直觉。
        code: |
          Money operator+(const Money& a, const Money& b) {
              return Money{a.value + b.value};
          }
        lesson_id: cpp-oop-overloading
  - id: interfaces
    name: 接口
    description: 描述能力合同而不保存实例状态的类型。
    compare:
      python:
        status: missing
        note: Python 以协议与鸭子类型表达接口合同，路线内没有接口标注课时。
      java:
        status: missing
        note: Java 接口在抽象类等课时出现，但没有以接口为主题的标注课时；implement 语法见相关课时。
      csharp:
        status: available
        summary: interface 声明成员合同，类可同时实现多个接口。
        difference: 默认接口实现与显式接口实现是 C# 独有特性。
        code: |
          interface IShape { double Area(); }
          class Square : IShape {
              public double Area() => 4;
          }
        lesson_id: csharp-oop-interfaces
      cpp:
        status: available
        summary: 以纯虚函数类模拟接口，多继承组合多个合同。
        difference: 没有专门 interface 关键字，合同靠纯虚析构与纯虚函数约定。
        code: |
          class IShape {
          public:
              virtual double area() const = 0;
              virtual ~IShape() = default;
          };
        lesson_id: cpp-oop-interfaces
  - id: namespaces
    name: 命名空间
    description: 按层次组织类型并避免同名冲突的机制。
    compare:
      python:
        status: missing
        note: Python 以模块与包组织命名空间，路线内没有 namespaces 标注课时；见模块课时。
      java:
        status: missing
        note: Java 以 package 组织命名空间，路线内没有以命名空间为主题的标注课时；见包相关课时。
      csharp:
        status: available
        summary: namespace 按层次组织类型，文件范围命名空间可减少缩进。
        difference: using 指令与别名让长命名空间名可用短名引用。
        code: |
          namespace Hard.Lessons;

          class Lesson { }
        lesson_id: csharp-oop-namespaces
      cpp:
        status: available
        summary: namespace 分组声明，内联命名空间与匿名命名空间控制链接性。
        difference: ADL（参数依赖查找）让命名空间参与重载决议，是 C++ 独有语义。
        code: |
          namespace hard {
              inline namespace v1 {
                  struct Lesson { };
              }
          }
        lesson_id: cpp-advanced-namespaces
  - id: preprocessor-directives
    name: 预处理器指令
    description: 编译期控制代码裁剪与诊断行为的 # 指令。
    compare:
      python:
        status: missing
        note: Python 没有预处理器，路线内无相应课时。
      java:
        status: missing
        note: Java 没有预处理器，路线内无相应课时。
      csharp:
        status: available
        summary: "#define/#if 控制条件编译，#region 与 #warning 组织与诊断源码。"
        difference: 指令不定义符号常量宏，仅用于条件编译与诊断，比 C/C++ 受限。
        code: |
          #if DEBUG
              Console.WriteLine("调试分支");
          #endif
        lesson_id: csharp-io-metadata-preprocessor-directives
      cpp:
        status: available
        summary: "#include、#define、#if 与 #pragma once 组成预处理阶段。"
        difference: 宏是文本替换，发生在编译之前，现代课程强调用常量与模板替代函数式宏。
        code: |
          #include <iostream>
          #define HARD_LESSON 1

          int main() {
          #if HARD_LESSON
              std::cout << "lesson\n";
          #endif
          }
        lesson_id: cpp-advanced-preprocessor
  - id: regular-expressions
    name: 正则表达式
    description: 用模式描述并匹配字符串形状的工具。
    compare:
      python:
        status: missing
        note: Python re 模块在标准库课时覆盖，路线内没有以正则为主题的标注课时（见 strings 与 functions 课时的关联映射）。
      java:
        status: missing
        note: Java 正则在 String/Regex 课时出现，但没有以正则为主题的标注课时。
      csharp:
        status: available
        summary: Regex 类提供编译、匹配与分组捕获，支持静态与实例两种用法。
        difference: RegexOptions 选项显式控制行为，超时设置防回溯爆炸。
        code: |
          var match = Regex.Match(input, @"\d+");
          Console.WriteLine(match.Value);
        lesson_id: csharp-io-metadata-regular-expressions
      cpp:
        status: available
        summary: <regex> 提供 std::regex_match/search 与 smatch 捕获结果。
        difference: 标准未定义实现算法，复杂回溯的性能特征需要实测。
        code: |
          std::regex pattern{R"(\d+)"};
          std::smatch match;
          std::regex_search(text, match, pattern);
        lesson_id: cpp-algorithms-concurrency-regex
  - id: attributes
    name: 特性
    description: 附着到程序元素上的声明式元数据。
    compare:
      python:
        status: missing
        note: Python 以装饰器表达类似意图，路线内没有 attributes 标注课时；见装饰器课时。
      java:
        status: missing
        note: Java 注解（Annotation）在反射课时外未单独成课，路线内没有 attributes 标注课时。
      csharp:
        status: available
        summary: "特性语法 [Attribute] 附着到类、方法或参数，运行期可被反射读取。"
        difference: 特性是真实类型，可继承自定义并携带构造参数。
        code: |
          [Lesson(Id = 7)]
          class Lesson { }
        lesson_id: csharp-io-metadata-attributes
      cpp:
        status: missing
        note: C++ 以 [[attribute]] 语法提供编译器提示，路线内没有相应标注课时。
  - id: reflection
    name: 反射
    description: 运行期检查程序集类型与成员元数据的能力。
    compare:
      python:
        status: missing
        note: Python 自省（type、dir、getattr）内建于语言，路线内没有反射标注课时。
      java:
        status: missing
        note: Java 反射在 Class 与 Object 课时出现，但没有以反射为主题的标注课时。
      csharp:
        status: available
        summary: Type 与 Assembly 在运行期枚举类型、属性与自定义特性。
        difference: 反射与特性组合是元编程主路径，性能开销需注意。
        code: |
          foreach (var property in typeof(Lesson).GetProperties())
              Console.WriteLine(property.Name);
        lesson_id: csharp-io-metadata-reflection
      cpp:
        status: missing
        note: C++ 标准缺少运行期反射，RTTI 仅覆盖 typeid/dynamic_cast，路线内没有反射标注课时。
  - id: properties
    name: 属性
    description: 通过 get/set 访问器受控读写对象状态的语言构造。
    compare:
      python:
        status: missing
        note: Python 的 property 装饰器提供同等能力，路线内没有 properties 标注课时；见类与对象课时。
      java:
        status: missing
        note: Java 用 getter/setter 手写访问器，没有语言级属性，路线内无 properties 标注课时。
      csharp:
        status: available
        summary: 属性把访问器暴露成字段语法，自动属性与 init 只读初始化常用。
        difference: 调用侧看不出方法调用，验证逻辑可无缝加入 set 访问器。
        code: |
          class Lesson {
              public int Points { get; init; }
          }
        lesson_id: csharp-language-features-properties
      cpp:
        status: missing
        note: C++ 没有语言级属性（依赖 getter/setter 或运算符技巧），路线内没有相应标注课时。
  - id: indexer
    name: 索引器
    description: 用 this 下标语法访问对象内部数据的带参属性。
    compare:
      python:
        status: missing
        note: Python 以 __getitem__ 支持下标语法，路线内没有 indexer 标注课时。
      java:
        status: missing
        note: Java 无索引器语法（以 get(int) 方法代替），路线内无相应标注课时。
      csharp:
        status: available
        summary: this[int index] 访问器让对象像数组一样按下标读写。
        difference: 索引器可重载多组参数类型并带校验，是语言级语法糖。
        code: |
          public string this[int index] => items[index];
        lesson_id: csharp-language-features-indexer
      cpp:
        status: missing
        note: C++ 以 operator[] 重载提供下标语法，路线内没有 indexer 标注课时；见运算符重载课时。
  - id: delegates
    name: 委托
    description: 把方法当作一等值绑定、传递与调用的签名类型。
    compare:
      python:
        status: missing
        note: Python 函数是一等对象，无需委托类型，路线内没有 delegates 标注课时。
      java:
        status: missing
        note: Java 以函数式接口与 lambda 模拟委托，路线内没有 delegates 标注课时。
      csharp:
        status: available
        summary: delegate 类型定义方法签名契约，多播委托可串联多个调用。
        difference: 语言级委托类型 + 多播是 C# 独有建模，事件构建在其上。
        code: |
          delegate int Transform(int value);
          Transform doubleIt = v => v * 2;
        lesson_id: csharp-language-features-delegates
      cpp:
        status: missing
        note: C++ 以函数指针与 std::function 表达同等能力，路线内没有 delegates 标注课时。
  - id: events
    name: 事件
    description: 发布者通知订阅者的封装委托机制。
    compare:
      python:
        status: missing
        note: Python 以回调列表或框架信号表达事件，路线内没有 events 标注课时。
      java:
        status: missing
        note: Java 以监听器接口模式表达事件，路线内没有 events 标注课时。
      csharp:
        status: available
        summary: event 关键字封装委托字段，仅允许在声明类内触发。
        difference: 订阅/退订（+=、-=）语法与封装规则是语言级约定。
        code: |
          public event EventHandler<int> Scored;
          Scored?.Invoke(this, 90);
        lesson_id: csharp-language-features-events
      cpp:
        status: missing
        note: C++ 无内建事件机制（常用回调与观察者模式），路线内没有相应标注课时。
  - id: anonymous-methods
    name: 匿名方法
    description: 就地定义、无需命名的方法体（含 lambda 形式）。
    compare:
      python:
        status: missing
        note: Python 的 lambda 与嵌套 def 覆盖同等能力，路线内没有匿名方法标注课时；见 lambda 课时。
      java:
        status: missing
        note: Java 8 lambda 表达式覆盖同等能力，路线内没有匿名方法标注课时；见 Java 8 特性课时。
      csharp:
        status: available
        summary: lambda 表达式与匿名方法体可捕获外部变量形成闭包。
        difference: 表达式树（Expression）可把 lambda 编译为数据，是查询提供者的基础。
        code: |
          Func<int, int> square = v => v * v;
          Console.WriteLine(square(5));
        lesson_id: csharp-language-features-anonymous-methods
      cpp:
        status: missing
        note: C++ lambda（含捕获列表）覆盖同等能力，路线内没有匿名方法标注课时。
  - id: pointers
    name: 指针
    description: 保存变量地址并支持间接访问与解引用的值。
    compare:
      python:
        status: missing
        note: Python 没有可操作的指针，对象经引用访问且由 GC 管理，路线内无 pointers 标注课时。
      java:
        status: missing
        note: Java 引用不可显式解引用或运算，路线内无 pointers 标注课时。
      csharp:
        status: missing
        note: C# 指针限定在 unsafe 上下文且仅服务端白名单题启用，路线内没有指针标注课时。
      cpp:
        status: available
        summary: 指针保存对象地址，支持解引用与算术运算，是 C++ 内存模型核心。
        difference: 裸指针的空悬与所有权问题由智能指针缓解，语义在全语言中最完整。
        code: |
          int value = 7;
          int* pointer = &value;
          std::cout << *pointer << '\n';
        lesson_id: cpp-core-memory-pointers
  - id: references
    name: 引用
    description: 绑定既有对象的别名，必须初始化且不可改绑。
    compare:
      python:
        status: missing
        note: Python 变量天然是对象引用，但没有 references 标注课时；语义见变量课时。
      java:
        status: missing
        note: Java 对象引用即默认语义，路线内没有 references 标注课时。
      csharp:
        status: missing
        note: C# 的 ref 参数与引用返回在路线内没有单独标注课时。
      cpp:
        status: available
        summary: 引用是对象的别名，初始化后不可改绑，常用于参数传递避免拷贝。
        difference: 与指针分离：引用不能为空、无需解引用语法，生命周期语义更安全。
        code: |
          void scale(int& value) { value *= 2; }

          int number = 7;
          scale(number);
        lesson_id: cpp-core-memory-references
  - id: signals
    name: 信号
    description: 以注册处理器方式响应的异步软件中断通知机制。
    compare:
      python:
        status: missing
        note: Python 以 signal 模块处理信号，路线内没有 signals 标注课时。
      java:
        status: missing
        note: Java 依赖 JVM 关闭钩子等机制处理进程信号，路线内没有 signals 标注课时。
      csharp:
        status: missing
        note: C# 进程信号处理在路线内没有相应标注课时。
      cpp:
        status: available
        summary: <csignal> 注册处理器响应 SIGINT 等异步中断。
        difference: 处理器内只允许调用异步信号安全函数，限制比事件回调更严。
        code: |
          std::signal(SIGINT, handle);
        lesson_id: cpp-advanced-signals
