concepts:
  - id: variables
    name: 变量
    description: 保存可变值的命名位置。
    compare:
      python:
        status: available
        summary: 变量是对象的命名引用，赋值即建立绑定，无需声明类型。
        difference: 动态类型，同一名字可重新绑定不同类型的对象，其余三语言均在声明处固定类型。
        code: |
          count = 10          # 绑定为 int 对象
          count = "ten"       # 可重新绑定 str 对象
          print(type(count))
        lesson_id: python-core-types-basic-syntax
      java:
        status: available
        summary: 变量是带静态声明类型的存储位置，分为基本类型与引用类型。
        difference: 编译期固定类型，赋值必须与声明类型兼容，区别于 Python 的动态绑定。
        code: |
          int count = 10;
          String label = "ten";  // 类型在声明处固定
          System.out.println(label);
        lesson_id: java-foundations-variable-types
      csharp:
        status: available
        summary: 变量必须先声明类型（或用 var 由右侧推断），默认有明确的编译期类型。
        difference: 与 Java 同为静态类型，但提供 var 推断与可空引用标注，空值检查更严格。
        code: |
          int count = 10;
          var label = "ten";   // 编译器推断为 string
          Console.WriteLine(label);
        lesson_id: csharp-foundations-variables
      cpp:
        status: available
        summary: 变量是确定类型的对象实体，可用 auto 让编译器推导初始化类型。
        difference: 对象语义直接承载值本身，区分栈对象与堆分配，局部标量应先初始化再读取；只声明变量本身不等于发生未定义行为。
        code: |
          int count = 10;
          auto label = std::string{"ten"};
          std::cout << label << '\n';
        lesson_id: cpp-foundations-variables
  - id: types
    name: 类型
    description: 值的分类及其允许操作。
    compare:
      python:
        status: available
        summary: 类型与对象绑定，常用 int、float、str、bool 等内建类型，可在运行期查询。
        difference: 类型检查发生在运行期，type() 与 isinstance() 是主要自省手段。
        code: |
          value = 3.14
          print(type(value))            # <class 'float'>
          print(isinstance(value, float))
        lesson_id: python-core-types-data-types
      java:
        status: available
        summary: 类型分为基本类型（int、double 等）与引用类型，编译期严格检查。
        difference: 基本类型与包装类型（Integer 等）双轨并存，需要手动考虑装箱拆箱。
        code: |
          double value = 3.14;
          Integer boxed = (int) value;   // 显式收窄与装箱
          System.out.println(boxed);
        lesson_id: java-core-api-number-math
      csharp:
        status: available
        summary: 类型系统统一为值类型与引用类型，全部隐式继承 object。
        difference: 提供可空值类型 int? 与模式匹配，空值语义比 Java 显式。
        code: |
          double value = 3.14;
          object boxed = value;          // 装箱为引用
          Console.WriteLine(boxed.GetType());
        lesson_id: csharp-oop-nullable
      cpp:
        status: available
        summary: 类型在编译期确定，通过 <type_traits> 可在编译期查询与分支。
        difference: 支持值类别与 cv 限定，模板按类型实例化，类型信息可以完全不进入运行期。
        code: |
          static_assert(std::is_integral_v<int>);
          double value = 3.14;
          std::cout << typeid(value).name() << '\n';
        lesson_id: cpp-foundations-data-types
  - id: control-flow
    name: 控制流
    description: 条件、分支与循环决定代码执行路径。
    compare:
      python:
        status: available
        summary: 用 if/elif/else 与 for、while 表达分支与循环，以缩进划分块。
        difference: 无 switch 原生结构（以 if 链或字典分发替代），for 是对可迭代对象的遍历。
        code: |
          for item in [1, 2, 3]:
              if item % 2 == 0:
                  print(item, "偶数")
        lesson_id: python-flow-collections-conditions
      java:
        status: available
        summary: if/else、switch、for、while、do-while 全套经典控制结构。
        difference: switch 支持字符串与箭头标签，for 既有计数循环也有 for-each 遍历。
        code: |
          for (int item : new int[]{1, 2, 3}) {
              if (item % 2 == 0) System.out.println(item + " 偶数");
          }
        lesson_id: java-foundations-loops
      csharp:
        status: available
        summary: if/else、switch、for、foreach、while 与模式匹配分支。
        difference: switch 表达式可以把分支作为值返回，模式匹配能力最强。
        code: |
          foreach (var item in new[] {1, 2, 3}) {
              if (item % 2 == 0) Console.WriteLine($"{item} 偶数");
          }
        lesson_id: csharp-foundations-loops
      cpp:
        status: available
        summary: if/else、switch、for、while 与基于范围的 for 循环。
        difference: 没有虚拟机层的安全网，越界访问或读取未初始化的条件值可能导致未定义行为；应先初始化并检查边界。
        code: |
          for (int item : {1, 2, 3}) {
              if (item % 2 == 0) std::cout << item << " 偶数\n";
          }
        lesson_id: cpp-foundations-decisions
  - id: functions
    name: 函数
    description: 可复用的命名行为单元。
    compare:
      python:
        status: available
        summary: 用 def 定义函数，参数无需类型，函数是与变量同级的对象。
        difference: 函数是一等公民，可赋值、传参、嵌套定义并被装饰器包装。
        code: |
          def add(left, right):
              return left + right

          print(add(2, 3))
        lesson_id: python-functions-iteration-functions
      java:
        status: available
        summary: 方法必须属于类或接口，参数与返回值都有静态类型。
        difference: 不存在独立于类的函数，重载靠参数表区分，方法不是一等值（需借函数式接口）。
        code: |
          static int add(int left, int right) {
              return left + right;
          }
          System.out.println(add(2, 3));
        lesson_id: java-core-api-methods
      csharp:
        status: available
        summary: 方法与本地函数都可用，支持可选参数、命名参数与表达式体。
        difference: 方法可通过委托作为值传递，语言级支持比 Java 直接。
        code: |
          static int Add(int left, int right) => left + right;
          Console.WriteLine(Add(2, 3));
        lesson_id: csharp-oop-methods
      cpp:
        status: available
        summary: 自由函数与成员函数并存，支持默认参数、重载与模板函数。
        difference: 函数重载在编译期决议，内联与模板实例化让抽象几乎零运行开销。
        code: |
          int add(int left, int right) { return left + right; }
          std::cout << add(2, 3) << '\n';
        lesson_id: cpp-core-memory-functions
  - id: collections
    name: 集合
    description: 组织多个值的数据结构。
    compare:
      python:
        status: available
        summary: 内建 list、tuple、dict、set，字面量即可创建。
        difference: 内建集合直接可用且可混合类型，无需导入容器头文件或泛型参数。
        code: |
          values = [1, 2, 3]
          values.append(4)
          print(len(values))
        lesson_id: python-flow-collections-lists
      java:
        status: available
        summary: 集合框架以 List、Set、Map 接口与 ArrayList、HashMap 等实现为核心。
        difference: 集合默认持引用、泛型擦除在运行期不保留元素类型，需通过 Iterator 遍历。
        code: |
          List<Integer> values = new ArrayList<>();
          values.add(1);
          System.out.println(values.size());
        lesson_id: java-collections-generics-collections-framework
      csharp:
        status: available
        summary: List<T>、Dictionary<K,V>、HashSet<T> 等泛型集合是默认选择。
        difference: 泛型在运行期保留，配合 LINQ 可对集合做声明式查询。
        code: |
          var values = new List<int> {1, 2, 3};
          values.Add(4);
          Console.WriteLine(values.Count);
        lesson_id: csharp-language-features-collections
      cpp:
        status: available
        summary: STL 容器按语义选择：vector、list、set、map、unordered_map 等。
        difference: 容器直接持有值并连续管理内存，迭代器失效规则是独有约束。
        code: |
          std::vector<int> values{1, 2, 3};
          values.push_back(4);
          std::cout << values.size() << '\n';
        lesson_id: cpp-stl-containers-vector
  - id: classes
    name: 类
    description: 描述对象状态和行为的类型模板。
    compare:
      python:
        status: available
        summary: 用 class 定义类型，属性在运行期动态附加，方法第一参数是 self。
        difference: 没有访问修饰符关键字，靠下划线约定表达私有，类本身就是对象。
        code: |
          class Counter:
              def __init__(self):
                  self.value = 0

          counter = Counter()
          print(counter.value)
        lesson_id: python-modules-io-oop-classes
      java:
        status: available
        summary: 类是引用类型的模板，字段、构造器与方法组成，默认单继承。
        difference: 访问控制是语言关键字，所有对象都在堆上由 GC 管理。
        code: |
          class Counter {
              int value = 0;
          }
          Counter counter = new Counter();
          System.out.println(counter.value);
        lesson_id: java-core-api-constructors
      csharp:
        status: available
        summary: class 定义引用类型，支持属性、表达式体成员与分部类。
        difference: 与结构体（值类型）语义分立，类实例默认可空注解受编译器检查。
        code: |
          class Counter {
              public int Value { get; set; }
          }
          var counter = new Counter();
          Console.WriteLine(counter.Value);
        lesson_id: csharp-oop-classes
      cpp:
        status: available
        summary: class 与 struct 仅默认访问不同，支持构造、析构与拷贝控制。
        difference: 对象可栈分配、可值语义复制，析构函数决定 RAII 资源释放时机。
        code: |
          class Counter {
          public:
              int value = 0;
          };
          Counter counter;
          std::cout << counter.value << '\n';
        lesson_id: cpp-oop-classes
  - id: inheritance
    name: 继承
    description: 基于已有类型扩展行为的机制。
    compare:
      python:
        status: missing
        note: Python 支持类继承（含多继承），但当前路线未设以继承为主题的标注课时，相关语法并入类与对象课时。
      java:
        status: available
        summary: extends 实现单继承，abstract 类约束子类必须实现的成员。
        difference: 类单继承 + 接口多实现的组合是 Java 的固定模型，无多重类继承。
        code: |
          class Animal {
              void speak() { System.out.println("..."); }
          }
          class Dog extends Animal {}
        lesson_id: java-oop-io-inheritance
      csharp:
        status: available
        summary: 冒号语法实现基类继承，sealed 可终止继承链。
        difference: 与 Java 同为单类继承，但支持扩展方法为不相关类型附加行为。
        code: |
          class Animal {
              public virtual void Speak() => Console.WriteLine("...");
          }
          class Dog : Animal { }
        lesson_id: csharp-oop-inheritance
      cpp:
        status: available
        summary: 支持公有/保护/私有三种继承方式与虚函数表驱动的动态派发。
        difference: 允许多继承与虚继承，需要显式考虑对象布局与菱形继承问题。
        code: |
          class Animal {
          public:
              virtual void speak() { std::cout << "...\n"; }
          };
          class Dog : public Animal {};
        lesson_id: cpp-oop-inheritance
  - id: polymorphism
    name: 多态
    description: 以统一接口处理不同具体类型的能力。
    compare:
      python:
        status: missing
        note: Python 天然以鸭子类型实现多态，但路线内没有以多态为主题的标注课时；相关讨论见类与对象课时。
      java:
        status: available
        summary: 通过方法重写与父类/接口引用在运行期派发。
        difference: 动态派发是默认行为，重载则发生在编译期，两者界限清晰。
        code: |
          Animal animal = new Dog();
          animal.speak();   // 运行期调用 Dog 的实现
        lesson_id: java-oop-io-polymorphism
      csharp:
        status: available
        summary: virtual/override 关键字显式声明可重写与重写成员。
        difference: 不写 virtual 就不能被重写，比 Java 的默认可重写更保守。
        code: |
          Animal animal = new Dog();
          animal.Speak();   // Dog 重写了 Speak
        lesson_id: csharp-oop-polymorphism
      cpp:
        status: available
        summary: 通过基类虚函数与指针/引用实现运行期多态。
        difference: 只有通过指针或引用调用虚函数才动态派发，值语义下会发生切片。
        code: |
          Animal& animal = dog;
          animal.speak();   // 虚函数表派发
        lesson_id: cpp-oop-polymorphism
  - id: exceptions
    name: 异常
    description: 表示并处理运行期错误的机制。
    compare:
      python:
        status: available
        summary: try/except/finally 捕获任意异常类型，异常也是普通对象。
        difference: 一切错误皆异常（包括 KeyError 等），没有受检异常概念。
        code: |
          try:
              risky()
          except ValueError as error:
              print(error)
        lesson_id: python-modules-io-oop-exceptions
      java:
        status: available
        summary: try/catch/finally 与 try-with-resources，异常分为受检与非受检两类。
        difference: 受检异常强制调用方声明或捕获，是四语言中唯一的编译期约束。
        code: |
          try {
              risky();
          } catch (IOException error) {
              System.out.println(error.getMessage());
          }
        lesson_id: java-oop-io-exceptions
      csharp:
        status: available
        summary: try/catch/finally 按类型匹配异常，using 语句负责资源释放。
        difference: 无受检异常，异常筛选器（when 子句）可附加条件。
        code: |
          try {
              Risky();
          } catch (IOException error) when (error.Data.Count == 0) {
              Console.WriteLine(error.Message);
          }
        lesson_id: csharp-io-metadata-exception-handling
      cpp:
        status: available
        summary: throw 抛出、try/catch 捕获，RAII 保证栈展开时资源释放。
        difference: 异常安全依赖析构函数，也可选择 noexcept 或错误码风格完全绕开异常。
        code: |
          try {
              risky();
          } catch (const std::exception& error) {
              std::cout << error.what() << '\n';
          }
        lesson_id: cpp-advanced-exceptions
  - id: generics
    name: 泛型
    description: 在保留类型约束的同时复用实现。
    compare:
      python:
        status: missing
        note: Python 以类型注解与 typing 泛型语法表达约束（运行期不强制），路线内在类型注解课时涉及，未设泛型标注课时。
      java:
        status: available
        summary: 泛型类与方法用类型参数复用实现，编译期检查类型安全。
        difference: 类型擦除使运行期没有泛型信息，不能 new T()，边界用 extends 约束。
        code: |
          static <T> T first(List<T> items) {
              return items.get(0);
          }
        lesson_id: java-collections-generics-generics
      csharp:
        status: available
        summary: List<T> 与 where 约束让泛型在运行期保持完整类型。
        difference: 泛型实化（reified）优于 Java 擦除，支持 typeof(T) 与泛型约束组合。
        code: |
          static T First<T>(List<T> items) where T : notnull => items[0];
        lesson_id: csharp-language-features-generics
      cpp:
        status: available
        summary: 模板在编译期按类型实例化，配合 concepts/traits 表达约束。
        difference: 图灵完备的编译期计算与特化机制，抽象零运行开销但报错信息更复杂。
        code: |
          template <typename T>
          T first(const std::vector<T>& items) { return items.front(); }
        lesson_id: cpp-advanced-templates
  - id: io
    name: IO
    description: 输入、输出与文件数据交互。
    compare:
      python:
        status: available
        summary: print/input 处理标准流，with open(...) 统一文件读写。
        difference: 文件对象自带上下文管理器，路径与编码是常见注意点。
        code: |
          with open("data.txt", encoding="utf-8") as handle:
              print(handle.read())
        lesson_id: python-modules-io-oop-input-output
      java:
        status: available
        summary: 以流（Stream/Reader/Writer）抽象分层处理字节与字符 IO。
        difference: 装饰器式流组合显式但冗长，NIO 提供面向缓冲区的 Files 工具。
        code: |
          try (var reader = Files.newBufferedReader(Path.of("data.txt"))) {
              System.out.println(reader.readLine());
          }
        lesson_id: java-oop-io-files-io
      csharp:
        status: available
        summary: File 静态类一行完成读写，Stream 体系支持细粒度控制。
        difference: 同步与异步 IO（async/await）在 API 层一等并列。
        code: |
          var text = File.ReadAllText("data.txt");
          Console.WriteLine(text);
        lesson_id: csharp-io-metadata-file-io
      cpp:
        status: available
        summary: iostream 处理标准流，fstream 按二进制或文本模式读写文件。
        difference: 流运算符可重载，缓冲区与刷新时机需要显式管理。
        code: |
          std::ifstream file{"data.txt"};
          std::string line;
          std::getline(file, line);
        lesson_id: cpp-stl-containers-iostream
  - id: concurrency
    name: 并发
    description: 协调多个执行任务的能力。
    compare:
      python:
        status: available
        summary: threading 多线程与 asyncio 协程并存，GIL 使 CPU 密集线程无法并行。
        difference: 解释器级全局锁是 Python 独有约束，IO 密集适合线程，CPU 密集需多进程。
        code: |
          import threading

          worker = threading.Thread(target=run, args=(1,))
          worker.start()
          worker.join()
        lesson_id: python-concurrency-network-threading
      java:
        status: available
        summary: Thread 与 Runnable 是并发基础，线程生命周期由 JVM 调度。
        difference: 没有全局锁限制，synchronized 与并发库（java.util.concurrent）支撑高并发。
        code: |
          Thread worker = new Thread(() -> run(1));
          worker.start();
          worker.join();
        lesson_id: java-network-concurrency-multithreading
      csharp:
        status: available
        summary: Thread、Task 与 async/await 组合表达并发与异步。
        difference: async/await 是语言级关键字，Task 调度器统一线程池管理。
        code: |
          var worker = new Thread(() => Run(1));
          worker.Start();
          worker.Join();
        lesson_id: csharp-capstone-multithreading
      cpp:
        status: available
        summary: std::thread 直接映射 OS 线程，配合 mutex、atomic 与 future 协调。
        difference: 内存模型由标准定义，数据竞争是未定义行为，必须显式同步。
        code: |
          std::thread worker{run, 1};
          worker.join();
        lesson_id: cpp-algorithms-concurrency-thread
  - id: memory
    name: 内存
    description: 程序数据的分配、存活与释放。
    compare:
      python:
        status: missing
        note: Python 由解释器与垃圾回收自动管理对象生命周期，路线内无专门内存标注课时；引用语义见变量与类课时。
      java:
        status: available
        summary: 对象在堆上由垃圾回收管理，可达性决定存活。
        difference: 无手动释放，序列化课时讨论对象图的持久化，是内存模型在路线内的落点。
        code: |
          byte[] snapshot = toBytes(graph);   // GC 管理堆对象
          System.out.println(snapshot.length);
        lesson_id: java-network-concurrency-serialization
      csharp:
        status: available
        summary: 类实例由 GC 管理，结构体随栈或容器按值存活。
        difference: 值类型/引用类型二分让内存语义显式，unsafe 指针只在服务端白名单题启用。
        code: |
          var point = new Point { X = 1 };   // struct，按值复制
          Console.WriteLine(point.X);
        lesson_id: csharp-oop-structs
      cpp:
        status: available
        summary: 手动 new/delete 与智能指针（unique_ptr、shared_ptr）共同管理堆内存。
        difference: RAII 把资源生命周期绑定到对象作用域，悬垂指针与泄漏是真实风险。
        code: |
          auto buffer = std::make_unique<int[]>(64);
          buffer[0] = 7;   // 离开作用域自动释放
        lesson_id: cpp-advanced-dynamic-memory
  - id: interpreter
    name: 解释器
    description: 读取并执行 Python 源代码的程序。
    compare:
      python:
        status: available
