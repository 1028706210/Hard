[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hard-api"
version = "0.1.0"
description = "Hard local programming learning API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1,<2",
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "httpx>=0.28,<0.29",
  "PyYAML>=6,<7",
  "markdown-it-py>=3,<4",
  "psutil>=6,<7"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
